[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skeletonfont"
version = "0.1.0"
description = "Build OpenType fonts from normalized skeleton sources."
requires-python = ">=3.10"
dependencies = [
    "cffsubr==0.4.0",
    "fonttools==4.62.1",
    "skia-pathops==0.9.2",
    "ufo2ft==3.8.2",
    "ufoLib2==0.18.1",
]

[project.scripts]
skeletonfont-build = "skeletonfont.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
